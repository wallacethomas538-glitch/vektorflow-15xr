services:
  - type: web
    name: vektorflow-15xr
    runtime: python
    repo: https://github.com/YOUR_USERNAME/vektorflow-15xr
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
    databases:
      - name: vektorflow-db
        databaseName: vektorflow
        user: vektorflow_user
