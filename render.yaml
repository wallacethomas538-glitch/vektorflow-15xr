services:
  - type: web
    name: vektorflow-15xr
    runtime: python
    repo: https://github.com/wallacethomas538-glitch/vektorflow-15xr
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ADMIN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CJ_API_KEY
        sync: false
      - key: CJ_API_SECRET
        sync: false
      - key: TIKTOK_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
    databases:
      - name: vektorflow-db
        databaseName: vektorflow
        user: vektorflow_user