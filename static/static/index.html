<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>VektorFlow 15xr – Commander Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #131a2b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #e8edf5;
        }
        .glass-card {
            max-width: 440px;
            width: 100%;
            background: rgba(20, 28, 48, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(90, 150, 255, 0.15);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(90, 150, 255, 0.05) inset;
            transition: transform 0.2s ease;
        }
        .glass-card:hover {
            transform: scale(1.01);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .logo-icon {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #5b9aff, #8b7aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-text {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f4ff, #b0c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .badge {
            display: inline-block;
            background: rgba(90, 150, 255, 0.12);
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.4px;
            color: #8bb4ff;
            border: 1px solid rgba(90, 150, 255, 0.1);
            margin-bottom: 1.75rem;
        }
        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            letter-spacing: -0.02em;
        }
        .sub {
            color: #8b9bb5;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            border-left: 3px solid #3b6fd4;
            padding-left: 1rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #b8c9e8;
            margin-bottom: 0.4rem;
            letter-spacing: 0.2px;
        }
        input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(90, 150, 255, 0.2);
            background: rgba(10, 16, 30, 0.6);
            color: #f0f4ff;
            font-size: 1rem;
            transition: 0.2s;
            outline: none;
        }
        input:focus {
            border-color: #5b9aff;
            box-shadow: 0 0 0 4px rgba(90, 150, 255, 0.15);
            background: rgba(10, 16, 30, 0.8);
        }
        input::placeholder {
            color: #4d5f7a;
        }
        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #4b7ef5, #7b5ff5);
            color: white;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 24px -6px rgba(75, 126, 245, 0.3);
            margin-top: 0.5rem;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 32px -6px rgba(75, 126, 245, 0.5);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .status-msg {
            margin-top: 1.5rem;
            padding: 0.9rem 1.2rem;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.9rem;
            color: #b0c4e8;
            text-align: center;
            min-height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }
        .status-msg.success {
            color: #7ae0b0;
            border-color: rgba(90, 200, 150, 0.2);
            background: rgba(90, 200, 150, 0.05);
        }
        .status-msg.error {
            color: #f7a0a0;
            border-color: rgba(255, 100, 100, 0.2);
            background: rgba(255, 100, 100, 0.05);
        }
        .footer-note {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #3e506e;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 1.5rem;
        }
        .footer-note span {
            color: #5b7bb5;
        }
        @media (max-width: 480px) {
            .glass-card {
                padding: 1.8rem 1.2rem;
            }
        }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">VektorFlow</span>
    </div>
    <div class="badge">15xr · Commander Access</div>

    <h2>Welcome back</h2>
    <div class="sub">Sign in to manage your store intelligence.</div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input
                    type="text"
                    id="username"
                    placeholder="commander"
                    value="commander"
                    required
            />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    value="vektorflow2026"
                    required
            />
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">
            🔑 Commander Login
        </button>
    </form>

    <div id="statusMessage" class="status-msg">
        ⚡ Ready for secure connection
    </div>
    <div class="footer-note">
        <span>⚙️</span> VektorFlow 15xr · v1.0
    </div>
</div>

<script>
    (function() {
        const form = document.getElementById('loginForm');
        const statusEl = document.getElementById('statusMessage');
        const loginBtn = document.getElementById('loginBtn');

        // --- UPDATE THIS TO MATCH YOUR BACKEND ENDPOINT ---
        const LOGIN_URL = '/commander/login';
        // ---------------------------------------------------

        function setStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = 'status-msg';
            if (type === 'success') {
                statusEl.classList.add('success');
            } else if (type === 'error') {
                statusEl.classList.add('error');
            }
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            setStatus('🔄 Authenticating ...', 'info');
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Logging in ...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                setStatus('⚠️ Please enter both username and password.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = '🔑 Commander Login';
                return;
            }

            try {
                const response = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Uncomment the line below if your backend requires an API key header
                        // 'X-API-Key': 'vektorflow-admin-2026-secure-key'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    setStatus(`✅ Welcome, ${data.user?.username || 'Commander'}! Redirecting ...`, 'success');
                    // Store token if needed
                    if (data.token) {
                        localStorage.setItem('commander_token', data.token);
                        localStorage.setItem('commander_user', JSON.stringify(data.user));
                    }
                    // Redirect to dashboard or reload
                    setTimeout(() => {
                        // window.location.href = '/dashboard'; // Uncomment to redirect
                        window.location.reload();
                    }, 1000);
                } else {
                    const errMsg = data.detail || data.message || 'Login failed. Please check credentials.';
                    setStatus(`❌ ${errMsg}`, 'error');
                }
            } catch (err) {
                console.error('Login error:', err);
                setStatus('❌ Network error. Could not reach the server.', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '🔑 Commander Login';
            }
        });
    })();
</script>

</body>
</html>
