<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VektorFlow 15xr | AI E-Commerce Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: white;
            padding: 1rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
        .status.online { background: #10b981; }
        .status.offline { background: #ef4444; }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(10px);
        }
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            margin: 0.25rem;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        pre {
            background: rgba(0,0,0,0.5);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .result { margin-top: 1rem; }
        .loading { opacity: 0.5; pointer-events: none; }
        .flex-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .store-id {
            background: #1e1b4b;
            padding: 0.5rem;
            border-radius: 8px;
            font-family: monospace;
            margin-bottom: 1rem;
        }
        hr { margin: 1rem 0; border-color: rgba(255,255,255,0.1); }
        .product-item {
            background: rgba(255,255,255,0.05);
            padding: 0.5rem;
            margin: 0.5rem 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ VektorFlow 15xr</h1>
    <div id="statusBadge" class="status offline">● Checking...</div>

    <!-- Store ID -->
    <div class="card">
        <h3>🏪 Your Store ID</h3>
        <input type="text" id="storeId" placeholder="my-shopify-store" value="test-store">
        <p style="font-size: 0.75rem; opacity: 0.7;">Use this ID to identify your catalog</p>
    </div>

    <!-- Upload Catalog -->
    <div class="card">
        <h3>📦 1. Upload Your Product Catalog</h3>
        <input type="file" id="catalogFile" accept=".json">
        <button id="uploadBtn">⬆️ Upload Catalog</button>
        <div id="uploadResult" class="result"></div>
    </div>

    <!-- Get Trends -->
    <div class="card">
        <h3>🔥 2. Find Trending Products</h3>
        <button id="trendsBtn">📈 Get Trends for My Store</button>
        <div id="trendsResult" class="result"></div>
    </div>

    <!-- Generate Campaign -->
    <div class="card">
        <h3>📱 3. Generate Click-to-Message Campaign</h3>
        <input type="text" id="productName" placeholder="Product name (exactly as in catalog)">
        <input type="text" id="trendKeyword" placeholder="Trend keyword (optional)">
        <button id="campaignBtn">💬 Generate Campaign</button>
        <div id="campaignResult" class="result"></div>
    </div>

    <!-- AI Citation Score -->
    <div class="card">
        <h3>🤖 4. AI Citation Score</h3>
        <input type="text" id="citationProduct" placeholder="Product name">
        <button id="citationBtn">📊 Get AI Score</button>
        <div id="citationResult" class="result"></div>
    </div>

    <!-- Weekly Report -->
    <div class="card">
        <h3>📊 5. Weekly Intelligence Report</h3>
        <button id="reportBtn">📋 Generate Weekly Report</button>
        <div id="reportResult" class="result"></div>
    </div>

    <!-- Direct LLM Call -->
    <div class="card">
        <h3>🧠 6. Direct LLM Call (Groq)</h3>
        <textarea id="llmPrompt" rows="2" placeholder="Ask something... e.g. Write a TikTok caption for wireless earbuds"></textarea>
        <button id="llmBtn">🤖 Call AI</button>
        <div id="llmResult" class="result"></div>
    </div>
</div>

<script>
    const BASE = window.location.origin;
    let currentStoreId = localStorage.getItem('storeId') || 'test-store';

    // DOM elements
    const storeIdInput = document.getElementById('storeId');
    const statusBadge = document.getElementById('statusBadge');
    
    // Helper
    function setLoading(btnId, isLoading) {
        const btn = document.getElementById(btnId);
        if (btn) {
            if (isLoading) btn.classList.add('loading');
            else btn.classList.remove('loading');
        }
    }
    
    function showResult(containerId, data, isError = false) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const color = isError ? '#ef4444' : '#10b981';
        const prefix = isError ? '❌ Error: ' : '✅ ';
        container.innerHTML = `<pre style="border-left: 3px solid ${color}; padding-left: 0.75rem;">${prefix}${typeof data === 'string' ? data : JSON.stringify(data, null, 2)}</pre>`;
    }
    
    // Check API health
    async function checkHealth() {
        try {
            const res = await fetch(`${BASE}/health`);
            if (res.ok) {
                statusBadge.className = 'status online';
                statusBadge.innerText = '● ONLINE';
                return true;
            }
        } catch(e) {}
        statusBadge.className = 'status offline';
        statusBadge.innerText = '● OFFLINE';
        return false;
    }
    
    // Upload catalog
    document.getElementById('uploadBtn').onclick = async () => {
        const fileInput = document.getElementById('catalogFile');
        const file = fileInput.files[0];
        if (!file) {
            showResult('uploadResult', 'Please select a JSON file first', true);
            return;
        }
        setLoading('uploadBtn', true);
        try {
            const text = await file.text();
            let products;
            try {
                products = JSON.parse(text);
            } catch(e) {
                // Try parsing as CSV? For now, assume JSON array
                showResult('uploadResult', 'Invalid JSON. Please upload a valid JSON array of products', true);
                setLoading('uploadBtn', false);
                return;
            }
            const storeId = document.getElementById('storeId').value;
            currentStoreId = storeId;
            localStorage.setItem('storeId', storeId);
            const res = await fetch(`${BASE}/ecommerce/catalog`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ store_id: storeId, products: products })
            });
            const data = await res.json();
            if (res.ok) showResult('uploadResult', data);
            else showResult('uploadResult', data.detail || 'Upload failed', true);
        } catch(err) {
            showResult('uploadResult', err.message, true);
        }
        setLoading('uploadBtn', false);
    };
    
    // Get trends
    document.getElementById('trendsBtn').onclick = async () => {
        const storeId = document.getElementById('storeId').value;
        setLoading('trendsBtn', true);
        try {
            const res = await fetch(`${BASE}/ecommerce/trends/${storeId}`);
            const data = await res.json();
            if (res.ok) showResult('trendsResult', data);
            else showResult('trendsResult', data.detail || 'Failed', true);
        } catch(err) {
            showResult('trendsResult', err.message, true);
        }
        setLoading('trendsBtn', false);
    };
    
    // Generate campaign
    document.getElementById('campaignBtn').onclick = async () => {
        const storeId = document.getElementById('storeId').value;
        const productName = document.getElementById('productName').value;
        const trend = document.getElementById('trendKeyword').value;
        if (!productName) {
            showResult('campaignResult', 'Please enter a product name', true);
            return;
        }
        setLoading('campaignBtn', true);
        try {
            let url = `${BASE}/ecommerce/campaign/${storeId}/${encodeURIComponent(productName)}`;
            if (trend) url += `?trend=${encodeURIComponent(trend)}`;
            const res = await fetch(url);
            const data = await res.json();
            if (res.ok) showResult('campaignResult', data);
            else showResult('campaignResult', data.detail || 'Failed', true);
        } catch(err) {
            showResult('campaignResult', err.message, true);
        }
        setLoading('campaignBtn', false);
    };
    
    // AI Citation score
    document.getElementById('citationBtn').onclick = async () => {
        const storeId = document.getElementById('storeId').value;
        const productName = document.getElementById('citationProduct').value;
        if (!productName) {
            showResult('citationResult', 'Please enter a product name', true);
            return;
        }
        setLoading('citationBtn', true);
        try {
            const res = await fetch(`${BASE}/ecommerce/citation/${storeId}/${encodeURIComponent(productName)}`);
            const data = await res.json();
            if (res.ok) showResult('citationResult', data);
            else showResult('citationResult', data.detail || 'Failed', true);
        } catch(err) {
            showResult('citationResult', err.message, true);
        }
        setLoading('citationBtn', false);
    };
    
    // Weekly report
    document.getElementById('reportBtn').onclick = async () => {
        const storeId = document.getElementById('storeId').value;
        setLoading('reportBtn', true);
        try {
            const res = await fetch(`${BASE}/ecommerce/weekly-report/${storeId}`);
            const data = await res.json();
            if (res.ok) showResult('reportResult', data);
            else showResult('reportResult', data.detail || 'Failed', true);
        } catch(err) {
            showResult('reportResult', err.message, true);
        }
        setLoading('reportBtn', false);
    };
    
    // Direct LLM call (Groq)
    document.getElementById('llmBtn').onclick = async () => {
        const prompt = document.getElementById('llmPrompt').value;
        if (!prompt) {
            showResult('llmResult', 'Please enter a prompt', true);
            return;
        }
        setLoading('llmBtn', true);
        try {
            const res = await fetch(`${BASE}/llm/call`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt, fallback: true })
            });
            const data = await res.json();
            if (res.ok) showResult('llmResult', data);
            else showResult('llmResult', data.detail || 'LLM call failed', true);
        } catch(err) {
            showResult('llmResult', err.message, true);
        }
        setLoading('llmBtn', false);
    };
    
    // Set store ID from localStorage
    storeIdInput.value = currentStoreId;
    storeIdInput.onchange = () => {
        currentStoreId = storeIdInput.value;
        localStorage.setItem('storeId', currentStoreId);
    };
    
    // Initial health check
    checkHealth();
    setInterval(checkHealth, 30000);
</script>
</body>
</html>
