<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VektorFlow 15xr | AI E-Commerce Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }
        .glass-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        textarea, input, select { background: rgba(255,255,255,0.15) !important; color: white !important; border: none !important; }
        .btn-primary { background: #3b82f6; border: none; }
        .btn-primary:hover { background: #2563eb; }
        pre { background: rgba(0,0,0,0.4); padding: 1rem; border-radius: 0.5rem; white-space: pre-wrap; }
        .status-badge { position: fixed; top: 1rem; right: 1rem; z-index: 1000; }
    </style>
</head>
<body class="text-white">

<div class="container py-4">
    <div class="status-badge">
        <span id="statusBadge" class="badge bg-secondary">● Checking</span>
    </div>

    <div class="text-center mb-4">
        <h1 class="display-4 fw-bold">⚡ VektorFlow 15xr</h1>
        <p class="lead">15 AI Agents | Memory Fabric | E-Commerce Intelligence</p>
    </div>

    <!-- Auth Section -->
    <div id="authSection" class="row justify-content-center">
        <div class="col-md-5">
            <div class="card glass-card text-white">
                <div class="card-body text-center p-4">
                    <i class="fas fa-lock fa-3x mb-3 text-primary"></i>
                    <h3>Sign In</h3>
                    <p>Enter your email to start your 7-day free trial</p>
                    <input type="email" id="loginEmail" class="form-control mb-2" placeholder="your@email.com">
                    <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Password (min 6 chars)">
                    <button id="signupBtn" class="btn btn-primary w-100 mb-2">📝 Sign Up (Free Trial)</button>
                    <button id="loginBtn" class="btn btn-outline-light w-100">🔓 Sign In</button>
                    <div id="authMessage" class="mt-3 small"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" style="display: none;">
        <div class="d-flex justify-content-between align-items-center glass-card p-3 rounded-3 mb-4">
            <div><i class="fas fa-user-circle me-2"></i> <span id="userEmail"></span> | <span id="userTier" class="badge bg-info"></span></div>
            <button id="logoutBtn" class="btn btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
        </div>

        <!-- API Keys -->
        <div class="card glass-card mb-4">
            <div class="card-body">
                <h5><i class="fas fa-key me-2"></i> 🔐 Your API Keys</h5>
                <div class="mb-2">
                    <label class="form-label small">Groq API Key</label>
                    <input type="password" id="userGroqKey" class="form-control" placeholder="gsk_...">
                </div>
                <div class="mb-2">
                    <label class="form-label small">Gemini API Key</label>
                    <input type="password" id="userGeminiKey" class="form-control" placeholder="AIza...">
                </div>
                <div class="mb-2">
                    <label class="form-label small">Hugging Face API Key</label>
                    <input type="password" id="userHfKey" class="form-control" placeholder="hf_...">
                </div>
                <button id="saveKeysBtn" class="btn btn-outline-light btn-sm">💾 Save My Keys</button>
                <div id="keysMessage" class="mt-2 small"></div>
            </div>
        </div>

        <!-- Store ID -->
        <div class="card glass-card mb-4">
            <div class="card-body">
                <h5><i class="fas fa-store me-2"></i> Your Store ID</h5>
                <input type="text" id="storeId" class="form-control" placeholder="my-shopify-store" value="test-store">
            </div>
        </div>

        <!-- Upload Catalog -->
        <div class="card glass-card mb-4">
            <div class="card-body">
                <h5><i class="fas fa-upload me-2"></i> 1. Upload Your Product Catalog</h5>
                <input type="file" id="catalogFile" class="form-control mb-2" accept=".json">
                <button id="uploadBtn" class="btn btn-primary">📤 Upload Catalog</button>
                <div id="uploadResult" class="mt-2"></div>
            </div>
        </div>

        <!-- Get Trends -->
        <div class="card glass-card mb-4">
            <div class="card-body">
                <h5><i class="fas fa-chart-line me-2"></i> 2. Find Trending Products</h5>
                <button id="trendsBtn" class="btn btn-primary">🔥 Get Trends</button>
                <div id="trendsResult" class="mt-2"></div>
            </div>
        </div>

        <!-- AI Assistant with Dropdown -->
        <div class="card glass-card mb-4">
            <div class="card-body">
                <h5><i class="fas fa-brain me-2"></i> 3. AI Assistant</h5>
                <select id="llmModel" class="form-select mb-2">
                    <option value="groq">🚀 Groq (Fastest)</option>
                    <option value="gemini">⭐ Gemini (Google)</option>
                    <option value="huggingface">🤗 Hugging Face</option>
                </select>
                <textarea id="llmPrompt" rows="3" class="form-control mb-2" placeholder="Ask something... e.g., Write a TikTok caption for wireless earbuds"></textarea>
                <button id="llmBtn" class="btn btn-primary">🤖 Call AI</button>
                <div id="llmResult" class="mt-2"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const BASE = window.location.origin;
    let authToken = localStorage.getItem('authToken');

    const authSection = document.getElementById('authSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const statusBadge = document.getElementById('statusBadge');

    async function callApi(endpoint, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers['Authorization'] = authToken;
        const res = await fetch(`${BASE}${endpoint}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
        const data = await res.json();
        return { res, data };
    }

    async function checkHealth() {
        try {
            const res = await fetch(`${BASE}/health`);
            if (res.ok) {
                statusBadge.className = 'badge bg-success';
                statusBadge.innerHTML = '● ONLINE';
                return true;
            }
        } catch(e) {}
        statusBadge.className = 'badge bg-danger';
        statusBadge.innerHTML = '● OFFLINE';
        return false;
    }

    async function signup(email, password) {
        const res = await fetch(`${BASE}/auth/signup`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, store_name: email.split('@')[0] })
        });
        const data = await res.json();
        if (res.ok) return await login(email, password);
        throw new Error(data.detail || 'Signup failed');
    }

    async function login(email, password) {
        const res = await fetch(`${BASE}/auth/login`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
            authToken = data.access_token;
            localStorage.setItem('authToken', authToken);
            await loadUserKeys();
            authSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            document.getElementById('userEmail').innerText = email;
            document.getElementById('userTier').innerText = 'Trial (7 days)';
            checkHealth();
            setInterval(checkHealth, 30000);
            return true;
        }
        throw new Error(data.detail || 'Login failed');
    }

    async function saveUserKeys() {
        const groqKey = document.getElementById('userGroqKey').value;
        const geminiKey = document.getElementById('userGeminiKey').value;
        const hfKey = document.getElementById('userHfKey').value;
        
        const { res, data } = await callApi('/user/keys', 'POST', {
            groq_api_key: groqKey,
            gemini_api_key: geminiKey,
            hf_api_key: hfKey
        });
        
        const msgDiv = document.getElementById('keysMessage');
        if (res.ok) {
            msgDiv.innerHTML = '<span class="text-success">✅ Keys saved!</span>';
            setTimeout(() => msgDiv.innerHTML = '', 3000);
        } else {
            msgDiv.innerHTML = `<span class="text-danger">❌ ${data.detail || 'Failed'}</span>`;
        }
    }

    async function loadUserKeys() {
        const { res, data } = await callApi('/user/keys', 'GET');
        if (res.ok && data) {
            if (data.groq_key) document.getElementById('userGroqKey').value = data.groq_key;
            if (data.gemini_key) document.getElementById('userGeminiKey').value = data.gemini_key;
            if (data.hf_key) document.getElementById('userHfKey').value = data.hf_key;
        }
    }

    function logout() {
        authToken = null;
        localStorage.removeItem('authToken');
        authSection.style.display = 'block';
        dashboardSection.style.display = 'none';
    }

    // Check if already logged in
    if (authToken) {
        authSection.style.display = 'none';
        dashboardSection.style.display = 'block';
        document.getElementById('userEmail').innerText = 'commander@vektorflow.com';
        document.getElementById('userTier').innerText = 'Trial (7 days)';
        loadUserKeys();
        checkHealth();
        setInterval(checkHealth, 30000);
    }

    // Event listeners
    document.getElementById('signupBtn')?.addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const msgDiv = document.getElementById('authMessage');
        if (!email || password.length < 6) { msgDiv.innerText = '❌ Valid email and password (min 6 chars)'; return; }
        msgDiv.innerText = '⏳ Creating account...';
        try {
            await signup(email, password);
            localStorage.setItem('userEmail', email);
            msgDiv.innerText = '✅ Signed up!';
            setTimeout(() => location.reload(), 1000);
        } catch(err) { msgDiv.innerText = `❌ ${err.message}`; }
    });

    document.getElementById('loginBtn')?.addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const msgDiv = document.getElementById('authMessage');
        if (!email || !password) { msgDiv.innerText = '❌ Enter email and password'; return; }
        msgDiv.innerText = '⏳ Logging in...';
        try {
            await login(email, password);
            localStorage.setItem('userEmail', email);
            msgDiv.innerText = '✅ Logged in!';
            setTimeout(() => location.reload(), 1000);
        } catch(err) { msgDiv.innerText = `❌ ${err.message}`; }
    });

    document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); location.reload(); });
    document.getElementById('saveKeysBtn')?.addEventListener('click', saveUserKeys);

    // Upload catalog
    document.getElementById('uploadBtn')?.addEventListener('click', async () => {
        const file = document.getElementById('catalogFile').files[0];
        if (!file) { document.getElementById('uploadResult').innerHTML = '<pre class="text-danger">Select a JSON file</pre>'; return; }
        document.getElementById('uploadBtn').disabled = true;
        try {
            const text = await file.text();
            const products = JSON.parse(text);
            const storeId = document.getElementById('storeId').value;
            const { res, data } = await callApi('/ecommerce/catalog', 'POST', { store_id: storeId, products });
            document.getElementById('uploadResult').innerHTML = `<pre>✅ ${JSON.stringify(data, null, 2)}</pre>`;
        } catch(err) {
            document.getElementById('uploadResult').innerHTML = `<pre class="text-danger">❌ ${err.message}</pre>`;
        }
        document.getElementById('uploadBtn').disabled = false;
    });

    // Get trends
    document.getElementById('trendsBtn')?.addEventListener('click', async () => {
        const storeId = document.getElementById('storeId').value;
        document.getElementById('trendsBtn').disabled = true;
        try {
            const { res, data } = await callApi(`/ecommerce/trends/${storeId}`, 'GET');
            document.getElementById('trendsResult').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        } catch(err) {
            document.getElementById('trendsResult').innerHTML = `<pre class="text-danger">❌ ${err.message}</pre>`;
        }
        document.getElementById('trendsBtn').disabled = false;
    });

    // Call LLM
    document.getElementById('llmBtn')?.addEventListener('click', async () => {
        const prompt = document.getElementById('llmPrompt').value;
        const model = document.getElementById('llmModel').value;
        if (!prompt) { document.getElementById('llmResult').innerHTML = '<pre class="text-danger">Enter a prompt</pre>'; return; }
        document.getElementById('llmBtn').disabled = true;
        try {
            const { res, data } = await callApi('/llm/call', 'POST', { prompt, model });
            document.getElementById('llmResult').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        } catch(err) {
            document.getElementById('llmResult').innerHTML = `<pre class="text-danger">❌ ${err.message}</pre>`;
        }
        document.getElementById('llmBtn').disabled = false;
    });
</script>
</body>
</html>
